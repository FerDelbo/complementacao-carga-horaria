<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pacientes</h1>

    <!-- CREATE: o formulário NÃO é enviado pelo navegador; o script.js cuida disso -->
    <form id="formPaciente">
      <h2>Novo paciente</h2>
      <label>Nome
        <input name="nome" required maxlength="100">
      </label>
      <label>CPF (só números)
        <input name="cpf" required pattern="\d{11}" maxlength="11" inputmode="numeric">
      </label>
      <label>Data de nascimento
        <input name="data_nascimento" type="date">
      </label>
      <label>Telefone
        <input name="telefone" maxlength="20">
      </label>
      <button type="submit">Cadastrar</button>
    </form>

    <!-- Aqui aparecem as mensagens de sucesso e de erro -->
    <p id="mensagem" role="status"></p>

    <!-- READ: a tabela começa vazia; o script.js preenche com o que vier do servidor -->
    <div class="rolagem">
      <table>
        <thead>
          <tr><th>Id</th><th>Nome</th><th>CPF</th><th>Nascimento</th><th>Telefone</th><th>Ações</th></tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
